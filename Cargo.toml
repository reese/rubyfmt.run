[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "eb5363ac922214bd79b1e4d146b1bd2097f3e168", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
