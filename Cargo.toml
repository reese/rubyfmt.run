[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "0229b92d43300895adc9c9368c201e85f0cf66a1", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
