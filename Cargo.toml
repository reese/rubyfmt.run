[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "8a8538afaecabe7242f720f79cb5b61768ab6a6a", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
