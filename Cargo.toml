[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "58f8f596ee80fe732d01919ed1b0a086dbf63e35", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
