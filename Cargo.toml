[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "97ad9bcab1b475f8f42861bcb5cf0dc4f7b8fa38", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
