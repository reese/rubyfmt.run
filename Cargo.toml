[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "1ee7a1a78ce7ae0b5bb5542b74abead25b78c041", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
