[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "884b9fd85bbdaa44376641cf9a803156bce7d0da", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
