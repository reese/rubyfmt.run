[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "094cdc86abcb7ad0b089989fe77cd2a987b053de", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
