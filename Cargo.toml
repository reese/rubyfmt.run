[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "fe6591e44485e7b2aacf820935f44757a56891af", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
