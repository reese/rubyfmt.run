[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "8a184e46e87aba149398b56dc93cb9a893c5d4e4", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
