[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "7c6ddaa73ed5c73f9431eb72e27e40070b095f47", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
