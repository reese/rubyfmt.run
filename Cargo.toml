[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "dbe818c4f662c80fbf157c75746dbfc4bb5b007a", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
