[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "fd2dc91612e66a56eca8b2337a52210ba98ffd15", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
