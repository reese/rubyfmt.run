[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "03dc2b37ac9f90ff54cbdbb3ae030fac79bf71f3", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
