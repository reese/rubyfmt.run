[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "d0dc749afb0381d89c1d8a3035b32db871454ed7", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
