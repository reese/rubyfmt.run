[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "b63fbaa9f2ac77c84c297e88f025037120e3f077", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
