[package]
name = "rubyfmt-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
rubyfmt = { git = "https://github.com/fables-tales/rubyfmt", rev = "2783e27517ee47f772c9fdd759d35cc471c59a06", default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
